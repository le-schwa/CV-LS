bio: |
  Leander Schwarzmeier is a PhD student at Helmholtz Munich, working on
  network inference for marine microbial time series. His research combines
  mathematical modelling, statistics, and machine learning to uncover
  interaction networks within microbial communities. He holds a Master's
  degree in Mathematics from the Technical University of Munich, where his
  thesis focused on the mathematical modelling of bacterial quorum sensing.

